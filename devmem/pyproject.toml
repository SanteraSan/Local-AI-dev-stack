[project]
name = "devmem"
version = "0.1.0"
description = "Local MCP memory server for the dev-ai-stack"
requires-python = ">=3.12,<3.13"
dependencies = [
    # mcp 2.x renamed FastMCP to MCPServer. Phase 3 calls for FastMCP, so stay on 1.x.
    "mcp>=1.30,<2",
    # psycopg[binary] ships libpq; the host has no system libpq.
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devmem = "devmem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devmem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the Postgres database devmem_test",
]
