# Clients use role aliases only. To swap a model, change it here, not in clients.
model_list:
  - model_name: coder
    litellm_params:
      model: ollama_chat/qwen2.5-coder-14b-32k
      api_base: http://127.0.0.1:11434
      keep_alive: -1
  - model_name: fast
    litellm_params:
      model: ollama_chat/qwen2.5-coder-3b-4k
      api_base: http://127.0.0.1:11434
      keep_alive: -1
  # Tool-calling agents. Not resident with coder: both plus fast do not fit in 16 GB.
  - model_name: agent
    litellm_params:
      model: ollama_chat/qwen3-14b-32k
      api_base: http://127.0.0.1:11434
      keep_alive: -1
  - model_name: reasoner
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://127.0.0.1:11434
  - model_name: reviewer
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://127.0.0.1:11434
  - model_name: vision
    litellm_params:
      model: ollama_chat/qwen3-vl:8b
      api_base: http://127.0.0.1:11434
  - model_name: embed
    litellm_params:
      model: ollama/nomic-embed-text-cpu
      api_base: http://127.0.0.1:11434
    model_info:
      mode: embedding

  # Cloud fallback. Uncomment together with router_settings.fallbacks once OPENROUTER_API_KEY is set.
  # - model_name: coder-cloud
  #   litellm_params:
  #     model: openrouter/<provider>/<model>
  #     api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  num_retries: 1
  timeout: 300
  # fallbacks: [{"coder": ["coder-cloud"]}, {"reasoner": ["coder-cloud"]}]

litellm_settings:
  drop_params: true
  # Do not persist prompts and responses in the spend log.
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
